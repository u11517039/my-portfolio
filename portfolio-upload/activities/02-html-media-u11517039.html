<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園自然觀察任務卡</title>
</head>
<body>
  <h1>校園自然觀察任務卡</h1>
  <p>今天我們用眼睛觀察，也用文字記錄發現。</p>

  <h2>任務一：看看葉脈</h2>
  <img src="media-03/leaf-photo.png" alt="陽光下的綠色葉片，可清楚看見葉脈紋路" width="300">
  <p>觀察葉片圖片，找出葉脈延伸的方向。</p>

  <h2>任務二：準備開始</h2>
  <audio src="media-03/notice.wav" controls></audio>
  <p>按下播放，聽到三個由低到高的短音後，開始你的觀察。</p>

  <h2>任務三：觀察花朵</h2>
  <video src="media-03/flower.mp4" controls width="300"></video>
  <p>播放短片，看看花朵怎麼移動，再用一句話描述。</p>
</body>
</html>
