<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放學後社團體驗表</title>
</head>
<body>
  <h1>放學後社團體驗表</h1>
  <p>這是介面練習，資料不會送出或保存，不能當成正式報名。</p>
  <!-- 本次使用獨立表單元件練習；沒有提交表單，也沒有資料儲存功能。 -->
  <p>
    <label for="nickname">我的暱稱</label>
    <input id="nickname" name="nickname" type="text" placeholder="例如：小星星">
  </p>
  <p>
    <label for="club">想體驗的社團</label>
    <select id="club" name="club">
      <option value="">請選擇社團</option>
      <option value="story">故事劇場</option>
      <option value="science">科學手作</option>
      <option value="boardgame">桌遊挑戰</option>
    </select>
  </p>
  <fieldset>
    <legend>方便參加的日子（可複選）</legend>
    <p><label><input type="checkbox" name="days" value="tuesday"> 星期二</label></p>
    <p><label><input type="checkbox" name="days" value="thursday"> 星期四</label></p>
    <p><label><input type="checkbox" name="days" value="friday"> 星期五</label></p>
  </fieldset>
  <fieldset>
    <legend>我期待的活動方式（可複選）</legend>
    <p><label><input type="checkbox" name="style" value="hands-on"> 動手製作</label></p>
    <p><label><input type="checkbox" name="style" value="teamwork"> 和同學合作</label></p>
    <p><label><input type="checkbox" name="style" value="presentation"> 上台分享</label></p>
  </fieldset>
  <p>
    <label for="message">想告訴老師的事</label><br>
    <textarea id="message" name="message" rows="3" cols="32" placeholder="例如：我想和同學一起完成一個小作品"></textarea>
  </p>
  <button type="button" disabled>練習版，尚未開放報名</button>
  <p>這個按鈕刻意停用。HTML 可以提供輸入與選擇介面，但這份練習沒有接上處理或儲存資料的功能。</p>
</body>
</html>
